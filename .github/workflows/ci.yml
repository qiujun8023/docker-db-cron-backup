name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: shellcheck -x scripts/*.sh scripts/engines/*.sh tests/*.sh
      - name: Run tests
        run: bash tests/run.sh

  integration:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, postgres]
    steps:
      - uses: actions/checkout@v7
      - name: Run integration tests
        run: bash tests/integration.sh ${{ matrix.engine }}

  # PR 只验证镜像能构建，不推送；master 上由 Docker Publish 构建并推送
  build:
    if: github.event_name == 'pull_request'
    needs: integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, postgres]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.engine }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.engine }}
